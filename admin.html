<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리듬 — 어드민 현황</title>
<style>
:root{
  --org:#FFC66F; --orgT:#895300; --orgBtn:#FFA213; --orgInk:#3A2400;
  --peach:#FFF6E8; --warm:#FFF9F2;
  --ink:#18181A; --mut:#6B6B70; --faint:#8C8B90;
  --line:#E4E4E7; --bg:#F5F5F6; --card:#FFFFFF;
  --ok:#0F7A5E; --okBg:#E4F3ED; --warn:#B7791F; --warnBg:#FDF3E2;
  --bad:#C0392B; --badBg:#FCECEA; --diff:#B8650A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
#gate{max-width:340px;margin:80px auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#gate h1{font-size:16px;margin-bottom:12px}
#gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px}
#gate button{width:100%;padding:10px;border-radius:8px;background:var(--orgBtn);color:var(--orgInk);font-weight:700;border:none;cursor:pointer}
#gateErr{color:var(--bad);font-size:12px;margin-top:8px;display:none}
#app{max-width:1080px;margin:0 auto;padding:24px 18px 80px;display:none}
h1.title{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:16px}
.overview{display:flex;gap:20px;color:var(--mut);font-size:13px;margin-bottom:20px}
.overview b{color:var(--ink);font-size:15px}
.reload{font-size:12px;color:var(--mut);text-decoration:underline;cursor:pointer;background:none;border:none;margin-bottom:16px}
.banner{background:var(--badBg);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}

.kpi-block{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--orgBtn);border-radius:10px;padding:18px 20px;margin-bottom:22px}
.kpi-block h2{font-size:14px;font-weight:800;color:var(--orgT);margin-bottom:14px}

.funnel{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.funnel .step{background:var(--warm);border-radius:8px;padding:10px 16px;text-align:center;min-width:110px}
.funnel .step .n{font-size:20px;font-weight:800}
.funnel .step .l{font-size:11px;color:var(--mut);margin-top:2px}
.funnel .arrow{color:var(--faint);font-size:16px}
.funnel .rate{font-size:12px;font-weight:700;color:var(--orgT);align-self:flex-end;margin-bottom:14px}

.care-summary{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.care-summary .cs{background:var(--warm);border-radius:8px;padding:10px 16px;min-width:130px}
.care-summary .cs .n{font-size:20px;font-weight:800}
.care-summary .cs .l{font-size:11px;color:var(--mut);margin-top:2px}
.care-summary .cs.ratio-bad .n{color:var(--bad)}
.care-summary .cs.ratio-ok .n{color:var(--ok)}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{background:var(--warm);color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase}
tr:last-child td{border-bottom:none}
.pct-ok{color:var(--ok);font-weight:700}
.pct-warn{color:var(--warn);font-weight:700}
.pct-bad{color:var(--bad);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:var(--okBg);color:var(--ok)}
.badge.warn{background:var(--warnBg);color:var(--warn)}
.badge.bad{background:var(--badBg);color:var(--bad)}
.catbadge{display:inline-block;background:var(--peach);color:var(--orgT);font-size:10px;font-weight:700;
  padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:1px}

details.trainer-drill{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
details.trainer-drill summary{padding:12px 16px;cursor:pointer;font-weight:700;font-size:13px;list-style:none}
details.trainer-drill summary::-webkit-details-marker{display:none}
details.trainer-drill summary::before{content:'▸ ';color:var(--faint)}
details.trainer-drill[open] summary::before{content:'▾ '}
details.trainer-drill summary .count{color:var(--mut);font-weight:400}

.weeknav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.weeknav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.weeknav button:disabled{opacity:.3;cursor:default}
.weeknav span{font-size:13px;font-weight:700;color:var(--orgT);min-width:150px;text-align:center}

.member-list{display:flex;flex-direction:column;gap:10px;padding:4px 16px 16px}
.member-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.member-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}
.member-head .mfreq{color:var(--mut);font-size:11px;margin-left:auto}
.member-contacts{font-size:11px;color:var(--mut);margin-top:8px}

.daygrid-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.daygrid-label{width:34px;flex:none;font-size:10.5px;color:var(--mut);font-weight:700}
.daygrid-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.daygrid-row.head .daygrid-cells span{text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;display:block}

.daycell2{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.daycell2.nt{background:none}
.daycell2.off{background:var(--bg);border:1px solid var(--line);color:var(--faint)}
.daycell2.upcoming{background:var(--card);border:1.5px dashed var(--line);color:var(--faint)}
.daycell2.pending{background:var(--peach);border:1.5px dashed var(--orgBtn);color:var(--orgT)}
.daycell2.done{background:var(--ok);color:#fff}
.daycell2.difficult{background:var(--diff);color:#fff}
.daycell2.noresp{background:var(--bad);color:#fff}

.contactdot{width:11px;height:11px;border-radius:50%;background:var(--line);margin:0 auto}
.contactdot.on{background:var(--orgBtn)}

.daylegend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 14px;font-size:11px;color:var(--mut)}
.daylegend span{display:inline-flex;align-items:center;gap:5px}
.daylegend i{width:14px;height:14px;border-radius:4px;display:inline-block}

section.appendix{margin-bottom:24px}
section.appendix h3{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--mut)}
.trend{display:flex;gap:8px;align-items:flex-end;height:170px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 14px 12px}
.trend .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
.trend .total{font-size:11px;font-weight:700;color:var(--mut)}
.trend .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;background:var(--line);min-height:2px}
.trend .seg-completed{background:var(--ok)}
.trend .seg-difficult{background:var(--diff)}
.trend .seg-none{background:var(--faint);opacity:.35}
.trend .day{font-size:11px;color:var(--mut);margin-top:2px;font-weight:600}
.small-tables{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.small-tables{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="gate">
  <h1>리듬 어드민 — 비밀번호</h1>
  <input id="secretInput" type="password" placeholder="비밀번호" autocomplete="off">
  <button id="gateBtn">조회</button>
  <div id="gateErr">비밀번호가 올바르지 않습니다.</div>
</div>

<div id="app">
  <h1 class="title">리듬 — 파일럿 핵심 KPI</h1>
  <div class="sub" id="generatedAt"></div>
  <div class="overview" id="overview"></div>
  <button class="reload" id="reloadBtn">새로고침</button>

  <!-- KPI 1 -->
  <div class="kpi-block">
    <h2>① 회원 참여 — 카톡을 보고 클릭·응답하는가</h2>
    <div class="funnel" id="funnel1"></div>
    <table id="kpi1Table"><thead></thead><tbody></tbody></table>
  </div>

  <!-- KPI 2 -->
  <div class="kpi-block">
    <h2>② 트레이너 앱 열람 빈도</h2>
    <table id="kpi2Table"><thead></thead><tbody></tbody></table>
  </div>

  <!-- KPI 3 -->
  <div class="kpi-block">
    <h2>③ 트레이너 케어 실행 — 회원 연락을 챙기는가</h2>
    <div id="zeroContactBanner" class="banner" style="display:none"></div>
    <div class="care-summary" id="careSummary"></div>
    <table id="kpi3Table"><thead></thead><tbody></tbody></table>
  </div>

  <!-- KPI 4 -->
  <div class="kpi-block">
    <h2>④ 트레이너별 회원 상세</h2>
    <div class="weeknav">
      <button id="weekPrev" aria-label="이전 주">‹</button>
      <span id="weekLabel"></span>
      <button id="weekNext" aria-label="다음 주">›</button>
    </div>
    <div class="daylegend">
      <span><i style="background:var(--ok)"></i>완료</span>
      <span><i style="background:var(--diff)"></i>어려움</span>
      <span><i style="background:var(--bad)"></i>미응답</span>
      <span><i style="background:var(--peach);border:1.5px dashed var(--orgBtn)"></i>오늘·대기</span>
      <span><i style="background:var(--card);border:1.5px dashed var(--line)"></i>예정</span>
      <span><i style="background:var(--bg);border:1px solid var(--line)"></i>추적꺼짐</span>
      <span><i style="background:none;border:1px dashed var(--faint)"></i>목표요일 아님(테두리 없음)</span>
      <span><i style="background:var(--orgBtn);border-radius:50%;width:10px;height:10px"></i>연락함</span>
    </div>
    <div id="drilldownList"></div>
  </div>

  <section class="appendix">
    <h3>참고 — 이번 주 트레이너별 저녁 체크</h3>
    <table id="weekTable"><thead></thead><tbody></tbody></table>
  </section>

  <section class="appendix">
    <h3>참고 — 최근 14일 저녁 체크 추이 (초록=완료, 주황=어려움, 회색=미응답)</h3>
    <div class="trend" id="trendChart"></div>
  </section>

  <section class="appendix">
    <div class="small-tables">
      <div>
        <h3>참고 — 확인 빈도 분포</h3>
        <table id="reminderTable"><thead></thead><tbody></tbody></table>
      </div>
      <div>
        <h3>참고 — 목표 요일 분포</h3>
        <table id="daysTable"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </section>

  <section class="appendix">
    <h3>참고 — 후속 연락 사유 분포</h3>
    <table id="reasonTable"><thead></thead><tbody></tbody></table>
  </section>
</div>

<script>
const SUPABASE_URL = 'https://ktcindjocrsndhxwtwfm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0Y2luZGpvY3JzbmRoeHd0d2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzQ3MTMsImV4cCI6MjA5OTg1MDcxM30._lib0VeTqnzkHL6iT363jCi7pFmaEQvEWn_BFg5IgqA';
const FN_URL = SUPABASE_URL + '/functions/v1/admin-stats';
const DAY_LABEL = ['일','월','화','수','목','금','토'];
const MON_SUN_LABEL = ['월','화','수','목','금','토','일'];
const REASON_LABEL = { difficult: '어려움 응답', no_response: '미응답', repeated_no_response: '반복 미응답' };
const STATUS_LABEL = { active: '활성', pending: '대기', inactive: '비활성' };
// admin-stats-function.sql의 v_window_start(이번 주 포함 지난 8주 = 9주, 63일)와 반드시 맞춰야 함
const TOTAL_WEEKS = 9;
const DAY_STATUS_META = {
  tracking_off: { icon:'–', cls:'off', title:'추적 꺼짐' },
  not_target:   { icon:'', cls:'nt', title:'목표 요일 아님' },
  upcoming:     { icon:'', cls:'upcoming', title:'예정(아직 발송 전)' },
  pending:      { icon:'⏳', cls:'pending', title:'오늘 발송, 응답 대기' },
  completed:    { icon:'✓', cls:'done', title:'완료' },
  difficult:    { icon:'!', cls:'difficult', title:'어려움' },
  no_response:  { icon:'×', cls:'noresp', title:'미응답' },
};

let weekOffset = 0; // 0 = 이번 주, 음수 = 지난 주
let lastData = null;

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const gateErr = document.getElementById('gateErr');

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function trainerLabel(tr){
  const cat = tr.category ? '<span class="catbadge">' + esc(tr.category) + '</span>' : '';
  return esc(tr.name) + (tr.center_name ? ' <span style="color:var(--mut);font-weight:400">(' + esc(tr.center_name) + ')</span>' : '') + cat;
}
function pct(n, d){ return d > 0 ? Math.round((n / d) * 100) : 0; }
function rateClass(p){ return p >= 60 ? 'pct-ok' : p >= 30 ? 'pct-warn' : 'pct-bad'; }
function daysAgo(iso){
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function daysSlice(days){
  const chunkIndex = TOTAL_WEEKS - 1 + weekOffset;
  return (days || []).slice(chunkIndex * 7, chunkIndex * 7 + 7);
}
function weekRangeLabel(windowStartStr){
  if (!windowStartStr) return '';
  const start = new Date(windowStartStr + 'T00:00:00');
  const chunkIndex = TOTAL_WEEKS - 1 + weekOffset;
  const ws = new Date(start); ws.setDate(start.getDate() + chunkIndex * 7);
  const we = new Date(ws); we.setDate(ws.getDate() + 6);
  const fmt = d => (d.getMonth() + 1) + '.' + d.getDate();
  return fmt(ws) + ' ~ ' + fmt(we) + (weekOffset === 0 ? ' · 이번 주' : '');
}

async function loadStats(secret){
  const res = await fetch(FN_URL, {
    headers: {
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'x-admin-secret': secret,
    }
  });
  if (res.status === 401) throw new Error('unauthorized');
  if (!res.ok) throw new Error('server error: ' + res.status);
  return res.json();
}

function renderMemberCard(m, weekDays){
  const contacts = (m.contacts || []).map(c =>
    new Date(c.contacted_at).toLocaleDateString('ko-KR', { month:'2-digit', day:'2-digit' }) +
    '(' + (REASON_LABEL[c.reason] || c.reason) + ')'
  ).join(', ') || '-';
  const sBadge = m.status === 'active' ? 'ok' : m.status === 'pending' ? 'warn' : 'bad';

  const checkCells = weekDays.map(d => {
    const meta = DAY_STATUS_META[d.status] || DAY_STATUS_META.not_target;
    return '<span class="daycell2 ' + meta.cls + '" title="' + d.day_date + ' · ' + meta.title + '">' + meta.icon + '</span>';
  }).join('');
  const contactCells = weekDays.map(d =>
    '<span class="contactdot' + (d.has_contact ? ' on' : '') + '" title="' + d.day_date + (d.has_contact ? ' · 연락함' : '') + '"></span>'
  ).join('');

  return '<div class="member-card">' +
    '<div class="member-head"><b>' + esc(m.name) + '</b>' +
      '<span class="badge ' + sBadge + '">' + (STATUS_LABEL[m.status] || m.status) + '</span>' +
      '<span class="mfreq">' + (m.reminder_level === 'frequent' ? '자주 챙김' : '필요한 만큼') + '</span></div>' +
    '<div class="daygrid-row head"><span class="daygrid-label"></span><div class="daygrid-cells">' +
      MON_SUN_LABEL.map(d => '<span>' + d + '</span>').join('') + '</div></div>' +
    '<div class="daygrid-row"><span class="daygrid-label">체크</span><div class="daygrid-cells">' + checkCells + '</div></div>' +
    '<div class="daygrid-row"><span class="daygrid-label">연락</span><div class="daygrid-cells">' + contactCells + '</div></div>' +
    '<div class="member-contacts">최근 연락: ' + contacts + '</div>' +
  '</div>';
}

function render(data){
  lastData = data;
  document.getElementById('generatedAt').textContent =
    '조회 시각: ' + new Date(data.generated_at).toLocaleString('ko-KR');

  const t = data.totals;
  const trainers = data.trainers || [];

  document.getElementById('overview').innerHTML =
    '<div><b>' + t.trainer_count + '</b> 트레이너</div>' +
    '<div><b>' + t.member_active + '</b> / ' + t.member_total + ' 활성 회원</div>';

  // ── KPI 1: 발송 → 클릭 → 응답 퍼널 ──────────────────────────────
  const clickRate = pct(t.evening_opened, t.evening_sent);
  const respGivenClick = pct(t.evening_completed + t.evening_difficult, t.evening_opened);
  document.getElementById('funnel1').innerHTML =
    '<div class="step"><div class="n">' + t.evening_sent + '</div><div class="l">발송</div></div>' +
    '<div class="arrow">→</div>' +
    '<div class="rate">' + clickRate + '%</div>' +
    '<div class="step"><div class="n">' + t.evening_opened + '</div><div class="l">클릭(열람)</div></div>' +
    '<div class="arrow">→</div>' +
    '<div class="rate">' + respGivenClick + '%</div>' +
    '<div class="step"><div class="n">' + (t.evening_completed + t.evening_difficult) + '</div><div class="l">응답</div></div>';

  const kpi1Tbl = document.getElementById('kpi1Table');
  kpi1Tbl.querySelector('thead').innerHTML =
    '<tr><th>트레이너</th><th>발송</th><th>클릭</th><th>클릭율</th><th>응답</th><th>응답율(발송 대비)</th></tr>';
  kpi1Tbl.querySelector('tbody').innerHTML = trainers.map(tr => {
    const cr = pct(tr.evening_opened, tr.evening_sent);
    const rr = pct(tr.evening_responded, tr.evening_sent);
    return '<tr>' +
      '<td>' + trainerLabel(tr) + '</td>' +
      '<td>' + tr.evening_sent + '</td>' +
      '<td>' + tr.evening_opened + '</td>' +
      '<td class="' + rateClass(cr) + '">' + cr + '%</td>' +
      '<td>' + tr.evening_responded + '</td>' +
      '<td class="' + rateClass(rr) + '">' + rr + '%</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="6">데이터 없음</td></tr>';

  // ── KPI 2: 트레이너 열람 빈도 ──────────────────────────────
  const kpi2Tbl = document.getElementById('kpi2Table');
  kpi2Tbl.querySelector('thead').innerHTML =
    '<tr><th>트레이너</th><th>마지막 접속</th><th>횟수</th><th>경과</th><th>정확도</th><th>상태</th></tr>';
  kpi2Tbl.querySelector('tbody').innerHTML = trainers.map(tr => {
    const d = daysAgo(tr.last_seen_at);
    const label = d === null ? '기록 없음' : (d === 0 ? '오늘' : d + '일 전');
    const badge = d === null ? 'bad' : d <= 1 ? 'ok' : d <= 3 ? 'warn' : 'bad';
    const badgeText = d === null ? '확인필요' : d <= 1 ? '양호' : d <= 3 ? '주의' : '점검필요';
    const srcBadge = tr.last_seen_source === 'app_open' ? '<span class="badge ok">정확</span>' : '<span class="badge warn">추정</span>';
    return '<tr>' +
      '<td>' + trainerLabel(tr) + '</td>' +
      '<td>' + (tr.last_seen_at ? new Date(tr.last_seen_at).toLocaleString('ko-KR') : '-') + '</td>' +
      '<td>' + (tr.open_count || 0) + '회</td>' +
      '<td>' + label + '</td>' +
      '<td>' + srcBadge + '</td>' +
      '<td><span class="badge ' + badge + '">' + badgeText + '</span></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="6">데이터 없음</td></tr>';

  // ── KPI 3: 케어 실행 (연락 챙김) ──────────────────────────────
  const careLoop = t.care_needed_total > 0 ? pct(t.contact_log_total, t.care_needed_total) : null;
  document.getElementById('careSummary').innerHTML =
    '<div class="cs"><div class="n">' + t.care_needed_total + '</div><div class="l">케어 필요 발생 건수</div></div>' +
    '<div class="cs"><div class="n">' + t.contact_log_total + '</div><div class="l">실제 연락 기록 건수</div></div>' +
    '<div class="cs ' + (careLoop !== null && careLoop < 50 ? 'ratio-bad' : 'ratio-ok') + '"><div class="n">' + (careLoop === null ? '-' : careLoop + '%') + '</div><div class="l">케어 필요 대비 연락 비율</div></div>';

  const banner = document.getElementById('zeroContactBanner');
  if (t.contact_zero_trainer_count > 0) {
    banner.style.display = 'block';
    banner.textContent = '연락기록이 0건인 트레이너가 ' + t.contact_zero_trainer_count + '명 있습니다 — 케어가 필요한 회원을 놓치고 있는지 확인이 필요합니다.';
  } else {
    banner.style.display = 'none';
  }

  const kpi3Tbl = document.getElementById('kpi3Table');
  kpi3Tbl.querySelector('thead').innerHTML =
    '<tr><th>트레이너</th><th>케어필요</th><th>연락기록</th><th>연락 비율</th></tr>';
  kpi3Tbl.querySelector('tbody').innerHTML = trainers.map(tr => {
    const ratio = tr.care_needed > 0 ? pct(tr.contact_log_total, tr.care_needed) : null;
    return '<tr>' +
      '<td>' + trainerLabel(tr) + '</td>' +
      '<td>' + tr.care_needed + '</td>' +
      '<td>' + tr.contact_log_total + '</td>' +
      '<td class="' + (ratio === null ? '' : rateClass(ratio)) + '">' + (ratio === null ? '-' : ratio + '%') + '</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="4">데이터 없음</td></tr>';

  // ── KPI 4: 트레이너별 회원 상세 (펼침형 + 주차 탐색) ──────────────────────────────
  document.getElementById('weekLabel').textContent = weekRangeLabel(data.window_start);
  document.getElementById('weekPrev').disabled = weekOffset <= -(TOTAL_WEEKS - 1);
  document.getElementById('weekNext').disabled = weekOffset >= 0;

  document.getElementById('drilldownList').innerHTML = trainers.map(tr => {
    const members = tr.members || [];
    const cards = members.map(m => renderMemberCard(m, daysSlice(m.days))).join('') ||
      '<p class="mut" style="padding:8px 16px 16px">등록된 회원 없음</p>';
    return '<details class="trainer-drill">' +
      '<summary>' + trainerLabel(tr) + ' <span class="count">— 회원 ' + members.length + '명</span></summary>' +
      '<div class="member-list">' + cards + '</div>' +
      '</details>';
  }).join('') || '<div>트레이너 없음</div>';

  // ── 참고 지표 ──────────────────────────────
  const weekTbl = document.getElementById('weekTable');
  weekTbl.querySelector('thead').innerHTML =
    '<tr><th>트레이너</th><th>발송</th><th>완료</th><th>어려움</th><th>미응답</th></tr>';
  weekTbl.querySelector('tbody').innerHTML = (data.this_week_by_trainer || []).map(w =>
    '<tr><td>' + esc(w.name) + '</td><td>' + w.evening_sent + '</td><td>' + w.evening_completed +
    '</td><td>' + w.evening_difficult + '</td><td>' + w.evening_no_response + '</td></tr>'
  ).join('') || '<tr><td colspan="5">이번 주 데이터 없음</td></tr>';

  const trend = data.last_14_days || [];
  const maxSent = Math.max(1, ...trend.map(d => d.evening_sent));
  document.getElementById('trendChart').innerHTML = trend.map(d => {
    const h = n => Math.max(2, Math.round((n / maxSent) * 108));
    return '<div class="bar">' +
      '<span class="total">' + d.evening_sent + '</span>' +
      '<div class="stack" style="height:' + h(d.evening_sent) + 'px">' +
        (d.evening_completed ? '<div class="seg-completed" style="height:' + h(d.evening_completed) + 'px"></div>' : '') +
        (d.evening_difficult ? '<div class="seg-difficult" style="height:' + h(d.evening_difficult) + 'px"></div>' : '') +
        (d.evening_no_response ? '<div class="seg-none" style="height:' + h(d.evening_no_response) + 'px"></div>' : '') +
      '</div>' +
      '<div class="day">' + d.check_date.slice(5) + '</div>' +
    '</div>';
  }).join('');

  const rl = data.reminder_level_distribution || {};
  document.getElementById('reminderTable').querySelector('thead').innerHTML = '<tr><th>빈도</th><th>회원 수</th></tr>';
  document.getElementById('reminderTable').querySelector('tbody').innerHTML =
    Object.entries(rl).map(([k, v]) => '<tr><td>' + (k === 'frequent' ? '자주 챙김' : '필요한 만큼') + '</td><td>' + v + '</td></tr>').join('');

  const pd = data.preferred_days_distribution || {};
  document.getElementById('daysTable').querySelector('thead').innerHTML = '<tr><th>요일</th><th>선택 회원 수</th></tr>';
  document.getElementById('daysTable').querySelector('tbody').innerHTML =
    Object.entries(pd).sort((a,b) => a[0]-b[0]).map(([k, v]) => '<tr><td>' + DAY_LABEL[k] + '</td><td>' + v + '</td></tr>').join('');

  const reasons = data.contact_logs_by_reason || {};
  document.getElementById('reasonTable').querySelector('thead').innerHTML = '<tr><th>사유</th><th>건수</th></tr>';
  document.getElementById('reasonTable').querySelector('tbody').innerHTML =
    Object.entries(reasons).map(([k, v]) => '<tr><td>' + (REASON_LABEL[k] || k) + '</td><td>' + v + '</td></tr>').join('') ||
    '<tr><td colspan="2">연락 기록 없음</td></tr>';

  gate.style.display = 'none';
  app.style.display = 'block';
}

async function tryLoad(secret){
  try {
    const data = await loadStats(secret);
    sessionStorage.setItem('redeum_admin_secret', secret);
    render(data);
  } catch (e) {
    if (e.message === 'unauthorized') {
      sessionStorage.removeItem('redeum_admin_secret');
      gateErr.style.display = 'block';
    } else {
      gateErr.style.display = 'block';
      gateErr.textContent = '조회 중 오류가 발생했습니다: ' + e.message;
    }
  }
}

document.getElementById('gateBtn').addEventListener('click', () => {
  gateErr.style.display = 'none';
  const secret = document.getElementById('secretInput').value.trim();
  if (secret) tryLoad(secret);
});
document.getElementById('secretInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('gateBtn').click();
});
document.getElementById('reloadBtn').addEventListener('click', () => {
  const secret = sessionStorage.getItem('redeum_admin_secret');
  if (secret) tryLoad(secret);
});
document.getElementById('weekPrev').addEventListener('click', () => {
  if (weekOffset > -(TOTAL_WEEKS - 1)) { weekOffset--; if (lastData) render(lastData); }
});
document.getElementById('weekNext').addEventListener('click', () => {
  if (weekOffset < 0) { weekOffset++; if (lastData) render(lastData); }
});

const saved = sessionStorage.getItem('redeum_admin_secret');
if (saved) tryLoad(saved);
</script>
</body>
</html>
